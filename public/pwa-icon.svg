<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Image Workbench">
  <title>Image Workbench</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="136" y="120" width="240" height="272" rx="24" />
    </clipPath>
  </defs>

  <!-- 基础 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- 图像画框 -->
  <rect x="136" y="120" width="240" height="272" rx="24" fill="#f8fafc" />

  <!-- 画框里的内容 -->
  <g clip-path="url(#frame)">
    <rect x="136" y="120" width="240" height="272" fill="#e2e8f0" />
    <circle cx="222" cy="200" r="26" fill="url(#sun)" />
    <path d="M136 392 L238 268 L306 344 L356 292 L376 392 Z" fill="#2563eb" />
    <path d="M136 392 L238 268 L288 326 L246 392 Z" fill="#1d4ed8" />
  </g>

  <!-- 画框描边 -->
  <rect x="136" y="120" width="240" height="272" rx="24" fill="none" stroke="#0f172a" stroke-width="6" opacity="0.18" />

  <!-- 工作台的"同步"弧线，暗示备份能力 -->
  <path d="M376 152 A 132 132 0 0 1 376 360" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <circle cx="380" cy="256" r="15" fill="#60a5fa" />
</svg>
